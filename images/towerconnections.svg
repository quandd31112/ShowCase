  <path d="M125 575 C300 575 300 315 475 315 H690 C840 315 825 650 980 650 H1220 C1360 650 1370 420 1490 420" fill="none" stroke="url(#road)" stroke-width="74" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="none" stroke-width="12" stroke-linecap="round" filter="url(#glow)">
    <path d="M360 205 620 470 840 210 1095 500 1305 275" stroke="#66c0f4"/>
    <path d="M360 205 840 210 620 470 1095 500 1305 275" stroke="#acd532" opacity="0.74"/>
    <path d="M620 470 760 695 1095 500" stroke="#ffce54" opacity="0.86"/>
  </g>
  <g filter="url(#glow)">
