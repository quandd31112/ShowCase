<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SLAPABOT cover</title>
  <desc id="desc">A colorful arcade robot runner cover with two lanes, obstacle cubes, and action streaks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2838"/>
      <stop offset="0.48" stop-color="#20344a"/>
      <stop offset="1" stop-color="#07121d"/>
    </linearGradient>
    <linearGradient id="lane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#66c0f4"/>
      <stop offset="1" stop-color="#1a9fff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.18" stroke="#66c0f4" stroke-width="2">
    <path d="M0 170H1600M0 330H1600M0 490H1600M0 650H1600"/>
    <path d="M260 0V900M520 0V900M780 0V900M1040 0V900M1300 0V900"/>
  </g>
  <g transform="skewX(-12)">
    <rect x="438" y="95" width="210" height="710" rx="64" fill="#08111b" opacity="0.72"/>
    <rect x="705" y="95" width="210" height="710" rx="64" fill="#08111b" opacity="0.72"/>
    <rect x="470" y="120" width="146" height="660" rx="44" fill="url(#lane)" opacity="0.34"/>
    <rect x="737" y="120" width="146" height="660" rx="44" fill="url(#lane)" opacity="0.34"/>
  </g>
  <g filter="url(#glow)">
    <path d="M1040 190 1385 122" stroke="#acd532" stroke-width="28" stroke-linecap="round"/>
    <path d="M1032 310 1450 315" stroke="#ffce54" stroke-width="18" stroke-linecap="round"/>
    <path d="M1018 455 1376 606" stroke="#fd6f53" stroke-width="24" stroke-linecap="round"/>
  </g>
  <g transform="translate(780 470)">
    <ellipse cx="0" cy="236" rx="170" ry="34" fill="#000" opacity="0.32"/>
    <rect x="-138" y="-178" width="276" height="276" rx="74" fill="#10d7df" stroke="#07121d" stroke-width="16"/>
    <rect x="-88" y="74" width="72" height="150" rx="34" fill="#dfe7ef" stroke="#07121d" stroke-width="14"/>
    <rect x="22" y="74" width="72" height="150" rx="34" fill="#dfe7ef" stroke="#07121d" stroke-width="14"/>
    <rect x="-180" y="-82" width="78" height="190" rx="38" fill="#ffce54" stroke="#07121d" stroke-width="14"/>
    <rect x="104" y="-82" width="78" height="190" rx="38" fill="#ff3333" stroke="#07121d" stroke-width="14"/>
    <circle cx="-56" cy="-54" r="36" fill="#fff" stroke="#07121d" stroke-width="12"/>
    <circle cx="58" cy="-54" r="36" fill="#fff" stroke="#07121d" stroke-width="12"/>
    <circle cx="-46" cy="-46" r="12" fill="#07121d"/>
    <circle cx="68" cy="-46" r="12" fill="#07121d"/>
    <path d="M-52 42 Q0 82 58 42" fill="none" stroke="#07121d" stroke-width="13" stroke-linecap="round"/>
    <path d="M-42 -184 0 -252 44 -184" fill="none" stroke="#07121d" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g filter="url(#glow)">
    <rect x="332" y="260" width="92" height="92" rx="18" fill="#fd6f53" stroke="#07121d" stroke-width="10"/>
    <rect x="1058" y="584" width="92" height="92" rx="18" fill="#acd532" stroke="#07121d" stroke-width="10"/>
    <rect x="1184" y="226" width="82" height="82" rx="16" fill="#8b7cff" stroke="#07121d" stroke-width="10"/>
  </g>
  <text x="88" y="770" fill="#dfe7ef" font-family="Inter, Arial, sans-serif" font-size="112" font-weight="800">SLAPABOT</text>
  <text x="96" y="836" fill="#66c0f4" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="5">2-LANE REACTION RUNNER</text>
</svg>
