      <path d="M-24 24h48V-12L0-34-24-12z" fill="#07121d"/>
    </g>
    <g transform="translate(840 210)">
      <circle r="54" fill="#ffce54"/>
      <path d="M-24 24h48V-12L0-34-24-12z" fill="#07121d"/>
    </g>
    <g transform="translate(1095 500)">
      <circle r="54" fill="#fd6f53"/>
