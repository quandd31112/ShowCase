<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Tower Connections cover</title>
  <desc id="desc">A stylized tower defense board with glowing linked towers and enemy paths.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102034"/>
      <stop offset="0.52" stop-color="#162c3f"/>
      <stop offset="1" stop-color="#07121d"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8d85a"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.16" stroke="#66c0f4" stroke-width="2">
    <path d="M120 170H1480M120 310H1480M120 450H1480M120 590H1480M120 730H1480"/>
